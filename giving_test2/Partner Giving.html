  var ch = CHARITIES.filter(function (c) { return c.id === o.charity; })[0];
  return el("section", { class: "stage", "aria-labelledby": "h-d" },
    el("div", { class: "done-mark", "aria-hidden": "true" }, "✓"),
    el("h2", { id: "h-d", tabindex: "-1" }, "Thank you for making an impact."),
    el("p", { class: "lead" }, "Your selection has been received. Thank you for helping us make our end-of-year giving initiative more meaningful."),
    el("p", { class: "lead" }, (o.name ? o.name + ", we" : "We") + "’ve recorded your choice" + (ch ? " of " + ch.name : "") + ". Your donation will be processed separately by Adobe; this page does not confirm that a donation has been made."),
    o.ref ? el("p", { class: "ref" }, "Reference: ", el("code", {}, o.ref)) : null);
}

/* ===== state ===== */
var app = document.getElementById("app"), progressHost = document.getElementById("progress"), live = document.getElementById("live");
var S = { view: "welcome", max: 0, errors: {}, dir: "fwd", submitting: false, submitError: null, ref: null,
  d: { fullName: "", organisation: "", email: "", adobeContact: "", proud: "", opportunity: "", charity: "", wantsMessage: "", message: "", wantsUpdate: "", confirmed: false } };
var set = function (k) { return function (v) { S.d[k] = v; }; };
var D = function () { return S.d; }, E = function () { return S.errors; };

function go(v, dir) { S.view = v; S.dir = dir || "fwd"; S.errors = {}; S.submitError = null; if (typeof v === "number") S.max = Math.max(S.max, v); render(); window.scrollTo(0, 0); }
function next() { S.errors = validate(S.view + 1, S.d); if (Object.keys(S.errors).length) return render(true); go(S.view + 1); }
function back() { go(S.view === 0 ? "welcome" : S.view - 1, "back"); }

function stage(i, title, intro, body, last) {
  return el("form", { novalidate: true, class: "stage" + (S.dir === "back" ? " back" : ""), "aria-labelledby": "h-s", onsubmit: function (ev) { ev.preventDefault(); last ? submit() : next(); } },
    el("p", { class: "eyebrow" }, STEPS[i].label), el("h2", { id: "h-s", tabindex: "-1" }, title), intro ? el("p", { class: "lead" }, intro) : null, body,
    el("div", { class: "actions" }, el("button", { type: "button", class: "btn btn-ghost", onclick: back }, "Back"),
      last ? el("button", { type: "submit", class: "btn btn-primary", disabled: S.submitting }, S.submitting ? "Submitting…" : "Submit my selection")
           : el("button", { type: "submit", class: "btn btn-primary" }, "Continue")));
}
function vAbout() {
  return stage(0, "Tell us who you are.", "Just the basics, so we can credit the donation to the right partner.", el("div", { class: "fields" },
    TextField({ name: "fullName", label: "Full name", required: true, autocomplete: "name", maxlength: LIMITS.fullName, value: D().fullName, error: E().fullName, onInput: set("fullName") }),
    TextField({ name: "organisation", label: "Organisation / company", required: true, autocomplete: "organization", maxlength: LIMITS.organisation, value: D().organisation, error: E().organisation, onInput: set("organisation") }),
    TextField({ name: "email", type: "email", label: "Business email address", required: true, autocomplete: "email", maxlength: LIMITS.email, value: D().email, error: E().email, onInput: set("email") }),
    TextField({ name: "adobeContact", label: "Adobe account manager or primary contact", optional: true, maxlength: LIMITS.adobeContact, value: D().adobeContact, error: E().adobeContact, onInput: set("adobeContact") })));
}
function vReflect() {
  return stage(1, "Every partnership has a story.", "We’d love to hear a little about yours.", el("div", { class: "fields" },
    el("p", { class: "hint" }, "Both questions are optional. Your answers help us understand our partners’ experiences and future priorities."),
    TextArea({ name: "proud", label: "What’s one thing we’ve achieved together this year that you’re proud of?", maxlength: LIMITS.proud, value: D().proud, error: E().proud, onInput: set("proud") }),
    TextArea({ name: "opportunity", label: "What is one opportunity you’d love to explore together in the year ahead?", maxlength: LIMITS.opportunity, value: D().opportunity, error: E().opportunity, onInput: set("opportunity") })));
}
function vCause() {
  return stage(2, "Which cause would you like to support?", "As a thank-you for being part of our year, Adobe will make a donation on your behalf to one of our three selected charity partners.",
    CharityCards({ charities: CHARITIES, selected: D().charity, error: E().charity, onSelect: function (id) { D().charity = id; S.errors = {}; var x = app.querySelector(".err"); if (x) x.remove(); } }));
}
function vPersonal() {
  var box = el("div", { class: "reveal", hidden: D().wantsMessage !== "yes" },
    TextArea({ name: "message", label: "Write your message here.", optional: false, maxlength: LIMITS.message, value: D().message, error: E().message, onInput: set("message") }));
  var q1 = YesNo({ name: "wantsMessage", legend: "Would you like to include a message alongside your charity selection?", value: D().wantsMessage,
    onChange: function (v) { D().wantsMessage = v; box.hidden = v !== "yes"; if (v === "yes") box.querySelector("textarea").focus(); } });
  q1.append(box);
  return stage(3, "Make it personal.", null, el("div", { class: "fields" }, q1,
    YesNo({ name: "wantsUpdate", legend: "Would you like to receive an update about the impact of this initiative?", value: D().wantsUpdate, onChange: set("wantsUpdate") })));
}
function vReview() {
  var body = el("div", {}, Review({ data: D(), onEdit: function (s) { go(s, "back"); } }), ConfirmBox({ checked: D().confirmed, error: E().confirmed, onChange: function (c) { D().confirmed = c; if (c) S.errors = {}; } }));
  if (S.submitError) body.append(Panel(S.submitError.t, S.submitError.m));
  return stage(4, "Almost there" + (D().fullName ? ", " + clean(D().fullName).split(" ")[0] : "") + ".", "Check everything looks right, then submit.", body, true);
}

/* ===== persistence (db capability; success only after the write resolves) ===== */
var dbP = null, userP = null;
function caps() {
  if (!window.claude || !window.claude.use) return Promise.resolve({ db: null, user: null });
  return Promise.all([window.claude.use("db").catch(function () { return null; }), window.claude.use("user").catch(function () { return null; })])
    .then(function (r) { return { db: r[0], user: r[1] }; });
}
function submit() {
  if (S.submitting) return;
  S.errors = validate("all", S.d);
  var bad = Object.keys(S.errors)[0];
  if (bad) { var s = ["fullName", "organisation", "email"].indexOf(bad) > -1 ? 0 : bad === "charity" ? 2 : ["proud", "opportunity"].indexOf(bad) > -1 ? 1 : bad === "message" ? 3 : 4; return s === 4 ? render(true) : go(s, "back"); }
  S.submitting = true; S.submitError = null; render();
  var d = S.d;
  var rec = { fullName: clean(d.fullName), organisation: clean(d.organisation), email: clean(d.email), adobeContact: clean(d.adobeContact), proud: clean(d.proud), opportunity: clean(d.opportunity),
    charity: d.charity, charityName: (CHARITIES.filter(function (c) { return c.id === d.charity; })[0] || {}).name || "", wantsMessage: d.wantsMessage || "",
    message: d.wantsMessage === "yes" ? clean(d.message) : "", wantsUpdate: d.wantsUpdate || "", confirmed: true, submittedAt: new Date().toISOString(), status: "received" };
  caps().then(function (c) {
    if (!c.db || !c.user) throw { kind: "unavailable" };
    return Promise.resolve(c.user.id()).then(function (id) {
      rec.ref = "ADB-" + String(id).replace(/[^A-Za-z0-9]/g, "").slice(0, 8).toUpperCase();
      return c.db.collection(COLLECTION).doc(String(id)).set(rec);      // one record per person: resubmitting replaces, never duplicates
    }).then(function () { S.submitting = false; S.ref = rec.ref; try { localStorage.setItem("pg-submitted", rec.ref); } catch (e) {} go("done"); });
  }).catch(function (err) {
    S.submitting = false;
    S.submitError = err && err.kind === "unavailable"
      ? { t: "We can’t save your selection from here", m: "Nothing has been submitted. Please open this page signed in, using the link Adobe sent you, and try again." }
      : { t: "We couldn’t save your selection", m: "Nothing has been submitted. Your answers are still here, so please try again in a moment." };
    render(false, true);
  });
}

/* ===== internal submissions view (#submissions; admins only) ===== */
var FIELDS = ["ref", "submittedAt", "fullName", "organisation", "email", "adobeContact", "proud", "opportunity", "charityName", "wantsMessage", "message", "wantsUpdate", "status"];
function csvCell(v) { var s = String(v == null ? "" : v); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; }
function toCsv(rows) { return [FIELDS.join(",")].concat(rows.map(function (r) { return FIELDS.map(function (f) { return csvCell(r[f]); }).join(","); })).join("\r\n"); }
function Admin() {
  var holder = el("div", { class: "tablebox" }, el("p", { class: "none", style: "padding:14px" }, "Loading…")), exportBtn = el("button", { type: "button", class: "btn btn-primary", disabled: true }, "Download CSV");
  var rows = [];
  function paint() {
    holder.replaceChildren();
    if (!rows.length) { holder.append(el("p", { class: "none", style: "padding:14px" }, "No submissions yet.")); return; }
    holder.append(el("table", {}, el("thead", {}, el("tr", {}, FIELDS.map(function (f) { return el("th", {}, f); }))),
      el("tbody", {}, rows.map(function (r) { return el("tr", {}, FIELDS.map(function (f) { return el("td", {}, r[f] == null ? "" : String(r[f])); })); }))));
    exportBtn.disabled = false;
  }
  exportBtn.addEventListener("click", function () {
    window.claude.use("downloads").then(function (dl) { if (dl) return dl.save({ filename: "partner-giving-submissions.csv", data: toCsv(rows) }); }).catch(function () {});
  });
  caps().then(function (c) {
    var allowed = c.user && c.user.canEdit && c.user.canEdit();
    if (!c.db || !allowed) { holder.replaceChildren(el("p", { class: "none", style: "padding:14px" }, "This view is for authorised Adobe staff only.")); return; }
    c.db.collection(COLLECTION).onSnapshot(function (snap) {
      var docs = snap && snap.docs ? snap.docs : Array.isArray(snap) ? snap : [];
      rows = Array.prototype.map.call(docs, function (x) { return typeof x.data === "function" ? x.data() : x; })
        .sort(function (a, b) { return String(b.submittedAt).localeCompare(String(a.submittedAt)); });
      paint();
    });
  });
  return el("section", { class: "stage" }, el("p", { class: "eyebrow" }, "Internal"), el("h2", {}, "Submissions"),
    el("p", { class: "lead" }, "Visible only to authorised editors. Contains personal information: export only for processing and delete when no longer needed."), exportBtn, holder);
}

/* ===== render ===== */
function render(focusErr, focusPanel) {
  var v = S.view;
  document.body.className = v === "welcome" || v === "done" ? "stage-dark" : "";
  Progress(progressHost, { current: typeof v === "number" ? v : -1, onJump: function (i) { go(i, "back"); } });
  var node = v === "welcome" ? Welcome({ onStart: function () { go(0); } })
    : v === "done" ? Done({ name: clean(D().fullName).split(" ")[0], charity: D().charity, ref: S.ref })
    : v === "admin" ? Admin()
    : [vAbout, vReflect, vCause, vPersonal, vReview][v]();
  app.replaceChildren(node);
  if (focusErr) { var b = app.querySelector('[aria-invalid="true"], .card input, .confirm.invalid input'); (b || app.querySelector("h2")).focus(); live.textContent = "Please fix the highlighted fields."; }
  else if (focusPanel) { var p = app.querySelector(".panel"); if (p) p.scrollIntoView({ block: "center" }); }
  else { var h = app.querySelector("h1, h2"); if (h) h.focus({ preventScroll: true }); live.textContent = typeof v === "number" ? "Step " + (v + 1) + " of " + STEPS.length + ": " + STEPS[v].label : ""; }
}
S.view = location.hash === "#submissions" ? "admin" : "welcome";
render();
</script>

</body></html>
